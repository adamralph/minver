name: spell-check
on:
  push:
    branches: [main, release-*]
  pull_request:
permissions: read-all
jobs:
  spell-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npx cspell@5.2.1 "**/*"
